version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - LOG_LEVEL=INFO
      - VEC_STORE_PATH=/app/vectorstore
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./vectorstore:/app/vectorstore
    networks:
      - aviation_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aviation_net

networks:
  aviation_net:
    driver: bridge
