version: "3.8"

services:
  api:
    build: .
    container_name: aviation-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./vectorstore:/app/vectorstore
    restart: always

  redis:
    image: redis:7-alpine
    container_name: aviation-rag-redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  vectorstore:
